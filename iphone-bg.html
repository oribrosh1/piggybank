<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>CreditKid Onboarding - Step 2</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;family=Inter:wght@100..900&amp;display=swap"
        rel="stylesheet" />
    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-background": "#121c2a",
                        "on-surface-variant": "#494454",
                        "error": "#ba1a1a",
                        "on-surface": "#121c2a",
                        "on-secondary-fixed": "#002113",
                        "on-primary-container": "#fffbff",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "secondary": "#006c49",
                        "surface-variant": "#d9e3f6",
                        "surface": "#f8f9ff",
                        "inverse-primary": "#d0bcff",
                        "inverse-surface": "#27313f",
                        "on-secondary-fixed-variant": "#005236",
                        "primary-fixed": "#e9ddff",
                        "on-tertiary-fixed-variant": "#5c4300",
                        "on-error": "#ffffff",
                        "on-primary-fixed-variant": "#5516be",
                        "surface-dim": "#d0dbed",
                        "on-primary-fixed": "#23005c",
                        "surface-bright": "#f8f9ff",
                        "secondary-container": "#6cf8bb",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-container": "#e6eeff",
                        "secondary-fixed-dim": "#4edea3",
                        "primary": "#6b38d4",
                        "surface-container-high": "#dee9fc",
                        "on-tertiary-fixed": "#261a00",
                        "primary-container": "#8455ef",
                        "on-secondary": "#ffffff",
                        "background": "#f8f9ff",
                        "outline": "#7b7486",
                        "surface-tint": "#6d3bd7",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#ffdf9f",
                        "tertiary-container": "#956e00",
                        "surface-container-low": "#eff4ff",
                        "secondary-fixed": "#6ffbbe",
                        "on-secondary-container": "#00714d",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#d9e3f6",
                        "outline-variant": "#cbc3d7",
                        "tertiary": "#765700",
                        "on-tertiary-container": "#fffbff",
                        "tertiary-fixed-dim": "#f9bd22",
                        "on-tertiary": "#ffffff",
                        "primary-fixed-dim": "#d0bcff"
                    },
                    fontFamily: {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-nav {
            background: rgba(248, 249, 255, 0.8);
            backdrop-filter: blur(12px);
        }

        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-surface font-body text-on-surface antialiased min-h-screen flex flex-col">
    <!-- 1. Header with 'Step 2 of 3' and back button -->
    <header
        class="sticky top-0 z-50 bg-[#f8f9ff] dark:bg-slate-950 flex justify-between items-center px-6 py-4 w-full max-w-none">
        <div class="flex items-center gap-4">
            <span class="material-symbols-outlined text-[#8B5CF6] dark:text-[#a78bfa] cursor-pointer">arrow_back</span>
            <span
                class="font-['Plus_Jakarta_Sans'] font-extrabold text-2xl tracking-tight text-[#8B5CF6] dark:text-[#a78bfa]">CreditKid</span>
        </div>
        <div class="flex flex-col items-end gap-1">
            <span class="font-label text-[10px] font-bold tracking-widest text-outline uppercase">Step 2 of 3</span>
            <div class="w-32 h-1.5 bg-surface-container-high rounded-full overflow-hidden">
                <div class="w-[66%] h-full bg-primary rounded-full"></div>
            </div>
        </div>
    </header>
    <main class="flex-grow container mx-auto px-6 py-8 md:py-12 max-w-5xl">
       
        <!-- 3. Phone mockup visualization -->
        <div class="flex flex-col items-center justify-center mb-16">
            <div class="relative group">
                <!-- Glass Background Decoration -->
                <div class="absolute -inset-8 bg-primary/5 blur-3xl rounded-full"></div>
                <!-- Phone Container -->
                <div
                    class="relative w-72 md:w-80 aspect-[1/2] bg-[#121c2a] rounded-[3rem] p-3 border-[6px] border-[#27313f] shadow-2xl overflow-hidden">
                    <div class="w-full h-full bg-white rounded-[2.2rem] overflow-hidden flex flex-col relative">
                        <!-- Phone Notch -->
                        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-24 h-6 bg-[#121c2a] rounded-b-2xl z-20">
                        </div>
                       
                    </div>
                </div>
            </div>
        </div>

    </main>
    <!-- Navigation Shell (Step Indicators) -->
    <nav
        class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-8 pb-8 pt-4 bg-white/60 dark:bg-slate-900/60 backdrop-blur-xl rounded-t-[2.5rem] shadow-[0_-8px_32px_rgba(18,28,42,0.08)]">
        <div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 opacity-60">
            <span class="material-symbols-outlined">looks_one</span>
            <span class="font-['Inter'] font-semibold text-[10px] uppercase tracking-widest mt-1">Step 1</span>
        </div>
        <div
            class="flex flex-col items-center justify-center bg-[#dee9fc] dark:bg-[#8B5CF6]/20 text-[#8B5CF6] dark:text-white rounded-full px-6 py-2 transition-all scale-110 duration-300 ease-out">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">looks_two</span>
            <span class="font-['Inter'] font-semibold text-[10px] uppercase tracking-widest mt-1">Step 2</span>
        </div>
        <div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 opacity-60">
            <span class="material-symbols-outlined">looks_3</span>
            <span class="font-['Inter'] font-semibold text-[10px] uppercase tracking-widest mt-1">Step 3</span>
        </div>
    </nav>
    <!-- Spacer for bottom nav -->
    <div class="h-32"></div>
</body>

</html>
